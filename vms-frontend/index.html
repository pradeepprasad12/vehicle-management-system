<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Fleet Dispatch Vehicle Management System"
  />

  <title>
    Fleet Dispatch · Vehicle Management System
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>


<body>


  <!-- =========================================================
       API CONFIGURATION
       ========================================================= -->

  <script>
    /*
      Django backend URL.

      Change this if your Django server is running
      somewhere else.

      Example:
      http://192.168.1.10:8000
    */

    window.VMS_API_BASE =
      'http://127.0.0.1:8000';
  </script>


  <!-- =========================================================
       LOGIN SCREEN
       ========================================================= -->

  <div
    id="login-screen"
  >

    <div
      class="badge-card"
    >


      <!-- API STATUS -->

      <div
        class="badge-eyebrow"
      >

        <span
          class="beacon green"
        ></span>

        DISPATCH TERMINAL ·

        <span
          id="api-base-label"
        >
          http://127.0.0.1:8000
        </span>

      </div>


      <!-- TITLE -->

      <h1
        class="badge-title"
      >
        Fleet Dispatch
      </h1>


      <p
        class="badge-sub"
      >
        Sign in with your vehicle
        management account.
      </p>


      <!-- =====================================================
           LOGIN FORM
           ===================================================== -->

      <form
        id="login-form"
        autocomplete="on"
      >


        <!-- USERNAME -->

        <div
          class="field"
        >

          <label
            for="login-username"
          >
            Username
          </label>

          <input
            id="login-username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Enter username"
            required
          />

        </div>


        <!-- PASSWORD -->

        <div
          class="field"
        >

          <label
            for="login-password"
          >
            Password
          </label>

          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          />

        </div>


        <!-- ROLE -->

        <div
          class="field"
        >

          <label>
            Sign in as
          </label>


          <div
            class="role-toggle"
          >

            <button
              type="button"
              class="active"
              data-role="admin"
            >
              Admin
            </button>


            <button
              type="button"
              data-role="driver"
            >
              Driver
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          id="login-submit"
          type="submit"
          class="btn btn-primary btn-block"
        >
          Sign in
        </button>


        <!-- LOGIN ERROR -->

        <div
          id="login-error"
          class="login-error hidden"
          role="alert"
        ></div>


      </form>


      <!-- FOOTER -->

      <div
        class="login-footnote"
      >
        JWT session · access + refresh tokens
      </div>


    </div>

  </div>


  <!-- =========================================================
       APPLICATION SHELL
       ========================================================= -->

  <div
    id="app-shell"
    class="hidden"
  >


    <!-- =======================================================
         SIDEBAR
         ======================================================= -->

    <aside
      class="sidebar"
    >


      <!-- BRAND -->

      <div
        class="brand"
      >

        <span
          class="beacon green"
        ></span>

        Fleet Dispatch

      </div>


      <!-- =====================================================
           NAVIGATION
           ===================================================== -->

      <div
        class="nav-group"
      >

        <div
          class="nav-eyebrow"
        >
          Operations
        </div>


        <a
          href="#/dashboard"
          class="nav-link"
          data-route="dashboard"
        >

          <span
            class="dot"
          ></span>

          Dashboard

        </a>


        <a
          href="#/vehicles"
          class="nav-link"
          data-route="vehicles"
        >

          <span
            class="dot"
          ></span>

          Vehicles

        </a>


        <a
          href="#/drivers"
          class="nav-link"
          data-route="drivers"
        >

          <span
            class="dot"
          ></span>

          Drivers

        </a>


        <a
          href="#/assignments"
          class="nav-link"
          data-route="assignments"
        >

          <span
            class="dot"
          ></span>

          Assignments

        </a>


      </div>


      <!-- =====================================================
           SESSION INFORMATION
           ===================================================== -->

      <div
        class="sidebar-footer"
      >


        <div
          class="session-chip"
        >

          Signed in as

          <br />

          <b
            id="session-username"
          >
            —
          </b>

          ·

          <span
            id="session-role"
          >
            —
          </span>

        </div>


        <!-- LOGOUT -->

        <button
          id="logout-btn"
          type="button"
          class="btn btn-ghost btn-block btn-sm"
        >
          Sign out
        </button>


      </div>


    </aside>


    <!-- =======================================================
         MAIN CONTENT

         app.js dynamically loads:
         - Dashboard
         - Vehicles
         - Drivers
         - Assignments
         ======================================================= -->

    <main
      id="main-content"
    >

      <div
        class="empty-state"
      >

        <div
          class="empty-title"
        >
          Loading Fleet Dispatch…
        </div>

        <p>
          Please wait.
        </p>

      </div>

    </main>


  </div>


  <!-- =========================================================
       TOAST NOTIFICATIONS
       ========================================================= -->

  <div
    id="toast-stack"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script type="module" src="js/app.js"></script>


</body>

</html>
